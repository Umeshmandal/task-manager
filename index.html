<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced Task Manager</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <div class="container">

        <div class="task-card">

            <h1>Task Manager</h1>

            <p class="subtitle">
                Manage your daily tasks easily
            </p>

            <div class="input-section">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task..."
                    autocomplete="off"
                >

                <button id="addTaskBtn">
                    Add Task
                </button>

            </div>

            <div class="task-info">

                <span id="taskCount">
                    0 tasks remaining
                </span>

                <button id="clearCompletedBtn">
                    Clear Completed
                </button>

            </div>

            <ul id="taskList"></ul>

            <p id="emptyMessage">
                No tasks yet. Add your first task!
            </p>

        </div>

    </div>

    <script src="./script.js"></script>

</body>
</html>
